# Network Time Security (NTS) using Cloudflare's public NTS server.
# This authenticates NTP responses, preventing time-spoofing attacks
# that could otherwise be used to break TLS certificate validation.
#
# IMPORTANT (audit note): Fedora's chronyd reads /etc/chrony.conf only.
# Upstream chrony supports confdir-based drop-ins ONLY when the main
# config explicitly contains an `include` directive; simply placing a
# file in /etc/chrony.conf.d/ does NOTHING on its own. Without the
# companion 00-abzu-chrony-main.conf below (which rewrites the main
# config to include this directory), this file was inert and the NTS
# hardening silently had no effect on shipped images.
server time.cloudflare.com iburst nts
